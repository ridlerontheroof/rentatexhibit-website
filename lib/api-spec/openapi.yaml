openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead / inquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a contact or tour request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Lead:
      type: object
      required:
        - id
        - type
        - firstName
        - lastName
        - email
        - phone
        - createdAt
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [contact, tour]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        message:
          type: ["string", "null"]
        preferredDate:
          type: ["string", "null"]
        createdAt:
          type: string
    LeadInput:
      type: object
      required:
        - type
        - firstName
        - lastName
        - email
        - phone
      properties:
        type:
          type: string
          enum: [contact, tour]
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
          maxLength: 30
        message:
          type: string
          maxLength: 2000
        preferredDate:
          type: string
          maxLength: 50
        unit:
          type: string
          pattern: '^\d{4}$'
          description: Apartment number (e.g. "0807") when the tour request is for a specific unit; used to attach the prospect to that unit's AppFolio listing.
        source:
          type: string
          maxLength: 200
          description: Visit-scoped attribution label captured from the landing URL's UTM tags (e.g. "Website (GoogleAds-SpringPromo)"). Sanitized server-side; omitted or invalid values fall back to the default "Website (Exhibit)".
