<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Host standardization: the canonical host is www.rentatexhibit.com.
         Static hosting here cannot issue a server-side 301 for the apex host,
         so this early client-side redirect is the best supported equivalent
         (canonical tags + sitemap remain www-only). Path, query string, and
         hash are all preserved. See SEO_PLAN.md finding 4 ("Canonical / host consistency"). -->
    <script>
      if (location.hostname === 'rentatexhibit.com') {
        location.replace(
          'https://www.rentatexhibit.com' + location.pathname + location.search + location.hash
        );
      }
    </script>
    <!-- Google Tag Manager (deferred) -->
    <!-- gtm.js costs ~112KB + ~180ms of mobile main-thread time, none of it
         needed for first paint. The dataLayer is initialized immediately so
         every event pushed before the script arrives is queued and delivered;
         the script itself loads on the first user interaction, on post-load
         idle, or after a 5s fallback timer (so short bounce visits still
         record a pageview). -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var loaded = false;
        var events = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
        function load() {
          if (loaded) return;
          loaded = true;
          for (var i = 0; i < events.length; i++) d.removeEventListener(events[i], load, true);
          var j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MDPWH532';
          d.head.appendChild(j);
        }
        for (var i = 0; i < events.length; i++) {
          d.addEventListener(events[i], load, { capture: true, passive: true, once: true });
        }
        w.addEventListener('load', function () {
          ('requestIdleCallback' in w ? w.requestIdleCallback : w.setTimeout)(load);
        });
        w.setTimeout(load, 5000);
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->
    <!-- Early availability fetch: on /available-units pages, start the
         availability request from the head so the network round-trip overlaps
         with the JS chunks downloading instead of following them. The React
         Query hook (use-availability.ts) consumes this promise at most once;
         failures fall back to a normal fetch there. -->
    <script>
      if (/^\/available-units(\/|$)/.test(location.pathname)) {
        window.__availabilityPrefetch = fetch('%BASE_URL%api/availability');
        window.__availabilityPrefetch.catch(function () {});
      }
    </script>
