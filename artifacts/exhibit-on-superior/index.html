<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Host standardization: the canonical host is www.rentatexhibit.com.
         Static hosting here cannot issue a server-side 301 for the apex host,
         so this early client-side redirect is the best supported equivalent
         (canonical tags + sitemap remain www-only). Path, query string, and
         hash are all preserved. See SEO_PLAN.md finding 4 ("Canonical / host consistency"). -->
    <script>
      if (location.hostname === 'rentatexhibit.com') {
        location.replace(
          'https://www.rentatexhibit.com' + location.pathname + location.search + location.hash
        );
      }
    </script>
    <!-- Google Tag Manager (deferred) -->
    <!-- gtm.js costs ~112KB + ~180ms of mobile main-thread time, none of it
         needed for first paint. The dataLayer is initialized immediately so
         every event pushed before the script arrives is queued and delivered;
         the script itself loads on the first user interaction, on post-load
         idle, or after a 5s fallback timer (so short bounce visits still
         record a pageview). -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        // Standard window.gtag stub: queues events into dataLayer so every
        // track*() call made before GTM's GA4 Configuration tag loads gtag.js
        // is buffered and delivered once gtag.js drains the queue. Without
        // this, all custom events (SightMap, lead, outbound-click) are dropped
        // because the helpers guard on `window.gtag != null`.  The stub must
        // not overwrite the real gtag when gtag.js has already installed it
        // (unlikely in head position but safe).
        w.gtag = w.gtag || function gtag() { w.dataLayer.push(arguments); };
        var loaded = false;
        // Real user gestures only. Deliberately NOT the 'scroll' event: the
        // browser fires synthetic scroll events from scroll anchoring when
        // below-fold content mounts, which would pull gtm.js right back into
        // the busy startup window with nobody touching the page. Wheel and
        // touchmove only fire for actual input.
        var events = ['pointerdown', 'touchstart', 'keydown', 'wheel', 'touchmove'];
        function load() {
          if (loaded) return;
          loaded = true;
          for (var i = 0; i < events.length; i++) d.removeEventListener(events[i], load, true);
          var j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MDPWH532';
          d.head.appendChild(j);
        }
        for (var i = 0; i < events.length; i++) {
          d.addEventListener(events[i], load, { capture: true, passive: true, once: true });
        }
        // Tab backgrounding (how most mobile bounces end) loads gtm.js
        // immediately — the browser finishes the request in the background,
        // so short no-gesture visits still deliver their queued pageview.
        d.addEventListener('visibilitychange', function () {
          if (d.visibilityState === 'hidden') load();
        });
        // Fallback for fully idle visits (no touch/scroll/keys at all):
        // shortly after the page finished loading, so a short bounce still
        // records its pageview. Anchored to `load` (with an absolute cap in
        // case `load` never fires) so the ~250ms gtm.js+gtag.js main-thread
        // hit lands after the startup window instead of inside it.
        w.addEventListener('load', function () { w.setTimeout(load, 5000); });
        w.setTimeout(load, 30000);
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->
    <!-- Early availability fetch: on /available-units pages, start the
         availability request from the head so the network round-trip overlaps
         with the JS chunks downloading instead of following them. The React
         Query hook (use-availability.ts) consumes this promise at most once;
         failures fall back to a normal fetch there. -->
    <script>
      if (/^\/available-units(\/|$)/.test(location.pathname)) {
        window.__availabilityPrefetch = fetch('%BASE_URL%api/availability');
        window.__availabilityPrefetch.catch(function () {});
      }
    </script>

    <!-- lcp:start -->
    <!-- Home hero LCP preload: AVIF-only (type gates it to AVIF-capable browsers;
         no href so non-imagesrcset browsers skip it — never a double download).
         Must mirror HERO_SLIDES[0] + SmartImg's <picture> (guarded by hero-lcp-preload.test.ts). -->
    <link rel="preload" as="image" type="image/avif" imagesrcset="/images/image-013-20170808-0861-n4esrp-800w.avif 800w, /images/image-013-20170808-0861-n4esrp-1280w.avif 1280w, /images/image-013-20170808-0861-n4esrp-2000w.avif 2000w" imagesizes="100vw" fetchpriority="high">

    <link rel="preload" href="/fonts/ReenieBeanie-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/BarlowSemiCondensed-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Vimeo preconnect: reduces cold-connection penalty when the user activates
         the video embed on /virtual-tour or a unit detail page. The iframe and
         its thumbnail CDN both resolve from these origins. crossorigin is required
         for i.vimeocdn.com because the thumbnail request uses CORS. -->
    <link rel="preconnect" href="https://player.vimeo.com">
    <link rel="preconnect" href="https://i.vimeocdn.com" crossorigin>
