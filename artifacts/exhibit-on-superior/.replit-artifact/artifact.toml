kind = "web"
previewPath = "/"
title = "Exhibit On Superior"
version = "1.0.0"
id = "artifacts/exhibit-on-superior"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25383

[services.development]
run = "pnpm --filter @workspace/exhibit-on-superior run dev"

[services.production]
serve = "static"
publicDir = "artifacts/exhibit-on-superior/dist/public"

# CI=true marks this as a deployment build so the fact-sheet PDF guard in
# scripts/generate-fact-sheet.ts warns instead of failing when the deploy
# image cannot reprint the docs PDF (a docs artifact must never block publish).
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/exhibit-on-superior", "run", "build" ]

[services.production.build.env]
CI = "true"

# Per-page prerendered HTML. Each indexable route (and its trailing-slash form)
# is served from its own static index.html so crawlers and link-preview bots
# (which do not run JS) receive the correct per-page title/description/canonical/
# OG + JSON-LD. Per the static-serve rules a rewrite is ignored when the path
# matches a real asset, so hashed js/css/images are unaffected. The catch-all
# SPA fallback MUST stay last so client-only paths and unknown URLs still boot.
[[services.production.rewrites]]
from = "/available-units"
to = "/available-units/index.html"

[[services.production.rewrites]]
from = "/available-units/"
to = "/available-units/index.html"

[[services.production.rewrites]]
from = "/photo-gallery"
to = "/photo-gallery/index.html"

[[services.production.rewrites]]
from = "/photo-gallery/"
to = "/photo-gallery/index.html"

[[services.production.rewrites]]
from = "/virtual-tour"
to = "/virtual-tour/index.html"

[[services.production.rewrites]]
from = "/virtual-tour/"
to = "/virtual-tour/index.html"

[[services.production.rewrites]]
from = "/amenities"
to = "/amenities/index.html"

[[services.production.rewrites]]
from = "/amenities/"
to = "/amenities/index.html"

[[services.production.rewrites]]
