kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Production starts the tracked, release-verified API bundle. Rebuilding here
# can replace it with a stale deployment source snapshot.
args = ["sh", "-c", "test -f artifacts/api-server/dist/index.mjs"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Keep the exact tracked bundle as the runtime input; the shell wrapper also
# forces a distinct deployment revision without changing Node behavior.
args = ["sh", "-c", "exec node --enable-source-maps artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
